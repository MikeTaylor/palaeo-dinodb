<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName dinodb.com
  DocumentRoot /home/mike/palaeo-dinodb/htdocs
  <Directory /home/mike/palaeo-dinodb/htdocs>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  SSLCertificateFile /etc/letsencrypt/live/dinodb.com/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/dinodb.com/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
